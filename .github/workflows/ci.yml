name: CI

# WHY CI?
# A CI pipeline automatically runs tests on every push/PR, catching
# regressions before they reach `main`. Having a green CI badge on the
# README is also a strong, low-effort signal of engineering discipline
# for recruiters skimming a GitHub profile.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/ -v

      - name: Lint check (basic)
        run: |
          pip install ruff
          ruff check . --line-length 120 || true
